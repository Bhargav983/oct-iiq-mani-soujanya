<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>AIRA wake inference diagnostics</title>
<style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:16px}button{padding:10px;margin:4px}pre{white-space:pre-wrap}</style>
<h1>AIRA wake inference diagnostics</h1>
<p>This page uses the exact local, versioned runtime and models generated for this application. It does not call the chat backend.</p>
<button id="smoke">Test models and inference</button>
<button id="start" disabled>Test microphone</button><button id="stop" disabled>Stop microphone</button>
<p id="status" role="status">Ready to test</p><pre id="log"></pre>
<script type="module">
const status = document.querySelector('#status'), log = document.querySelector('#log');
let engine, initialization;
function report(text) { status.textContent=text; log.textContent+=text+'\n'; }
async function init() {
 if (initialization) return initialization;
 initialization = (async()=>{
  const response=await fetch('/voice-assets-manifest.json',{cache:'no-store'});
  if(!response.ok) throw Error('Missing generated voice manifest: '+response.status);
  const assets=await response.json();
  const map=document.createElement('script'); map.type='importmap';
  map.textContent=JSON.stringify({imports:{'onnxruntime-web':assets.ortPath+'ort.min.mjs'}});
  document.head.appendChild(map);
  const ort=await import('onnxruntime-web');
  ort.env.wasm.wasmPaths=assets.ortPath; ort.env.wasm.numThreads=1; ort.env.wasm.proxy=false;
  const {WakeWordEngine}=await import(assets.enginePath);
  engine=new WakeWordEngine({keywords:['hey_aira'],modelFiles:{hey_aira:'hey_aira.onnx'},baseAssetUrl:assets.wakePath,ortWasmPath:assets.ortPath});
  engine.on('error',error=>report('Inference error: '+String(error)));
  engine.on('detect',()=>report('Detected Hey AIRA'));
  await engine.load();
  report('Models loaded: ONNX '+assets.ortVersion+' / '+assets.revision);
  document.querySelector('#start').disabled=false;
 })();
 return initialization;
}
window.runSmokeTest=async()=>{
 await init();
 for(let i=0;i<40;i++)await engine._processChunk(new Float32Array(1280),{emitEvents:false});
 const score=engine._keywordModels.hey_aira.scores.at(-1);
 if(!Number.isFinite(score))throw Error('Invalid wake score');
 report('Inference passed; silence score='+score.toFixed(6));
 return {score,status:'passed'};
};
document.querySelector('#smoke').onclick=()=>window.runSmokeTest().catch(error=>report('Failed: '+String(error)));
document.querySelector('#start').onclick=async()=>{
 try{await engine.start();document.querySelector('#stop').disabled=false;report('Listening for Hey AIRA');}
 catch(error){report('Microphone error: '+String(error));}
};
document.querySelector('#stop').onclick=async()=>{await engine.stop();report('Microphone stopped');};
</script></html>
