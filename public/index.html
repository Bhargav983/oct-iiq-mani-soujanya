<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
   <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
             <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
/>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>AIR₂O</title>
    <style>
      #airo-startup {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(180deg, #3e99ed 0%, #2b7ed6 100%);
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      #airo-startup .airo-startup-spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 20px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: airo-startup-spin 0.9s linear infinite;
      }
      #airo-startup h1 { margin: 0 0 10px; font-size: 24px; }
      #airo-startup p { margin: 0; font-size: 15px; line-height: 1.5; opacity: 0.94; }
      @keyframes airo-startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #airo-startup .airo-startup-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="airo-startup" role="status" aria-live="polite">
        <div>
          <div class="airo-startup-spinner" aria-hidden="true"></div>
          <h1>Starting AIR₂O</h1>
          <p>Please wait while the app gets ready.</p>
        </div>
      </div>
    </div>

  </body>
</html>
